{id:5,n:"Катя",ic:"moon",st:"off",s:"Не в сети",c:["#c59af5","#6a2fb8"],r:[]}];
const K={
1:[[/привет|здаров|хай/,["Приветик!","О, привет! Как дела?"]],[/как дела|как ты/,["Норм, слушаю музыку. А ты?","Живу-поживаю, делаю бит"]],[/трек|музык|бас|звук|песн|микс/,["Скинь ссылку, послушаю!","Бас там жирный, согласна","Микс чуть глуховат, но идея огонь"]],[/умри|убью|сдохни|бесишь/,["Ай, злюка! Обижусь","Ну ты и грубиян"]]],
2:[[/привет|здаров|хай/,["Здарова, я в сборке, отвечу позже"]],[/баг|ошибк|не работает|сломал|краш|глюч/,["Кинь лог, гляну","Это не баг, это фича","Опять кэш, сотри и пересобери"]],[/сборк|билд|компил|cmake|make/,["Собирается уже двадцать минут","CMake опять ругается","Пересобрал, завелось. Не трогай"]],[/умри|убью|сдохни/,["Сначала собери, потом убивай"]]],
4:[[/привет|здаров|хай/,["Привет! Про Longhorn говорить будем?"]],[/longhorn|лонгхорн|vista|виста|aero|аэро|сайдбар/,["Longhorn мог стать лучшей Windows","Aero и сайдбар, вот это был стиль","WinFS до сих пор жалко"]],[/windows|винд|xp|хрю/,["XP была классикой","Семёрка до сих пор лучшая"]],[/умри|убью|сдохни/,["Ты и Vista одинаково грубые"]]]};
const G='<ellipse cx="16" cy="8.5" rx="10.5" ry="6.5" fill="url(#gG)"/>';
const face=(x,g="gF")=>`<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="url(#${g})" stroke="${g==="gA"?"#8e1a08":"#b86a00"}" stroke-width="1.2"/>${G}${x}</svg>`;
const E='<ellipse cx="11.5" cy="13" rx="1.9" ry="2.5" fill="#3a2200"/><ellipse cx="20.5" cy="13" rx="1.9" ry="2.5" fill="#3a2200"/>';
const S=d=>`<path d="${d}" stroke="#3a2200" stroke-width="2" fill="none" stroke-linecap="round"/>`;
const SM=S("M9.5 19q6.5 7 13 0"),TR="M10 24q6-6 12 0";
const EMO={
smile:face(E+SM),
grin:face(E+'<path d="M8 18h16q-1.5 8-8 8t-8-8z" fill="#5a1a00"/><path d="M9 18h14q-.4 2.4-1.2 3H10.2q-.8-.6-1.200-3z" fill="#fff"/>'),
wink:face('<path d="M8.5 13.5q3-3 6 0" stroke="#3a2200" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="20.5" cy="13" rx="1.9" ry="2.5" fill="#3a2200"/>'+SM),
cool:face('<path d="M5.5 11h9.5v5q0 3.5-4.75 3.5T5.5 16zM17 11h9.5v5q0 3.5-4.75 3.5T17 16z" fill="#1c1c1c"/><path d="M15 12h2" stroke="#1c1c1c" stroke-width="1.5"/><path d="M7.5 12.5h5M19 12.5h5" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>'+S("M10 23q6 4 12 0")),
sad:face(E+S(TR)),
cry:face('<path d="M8.5 10.5l5 2.5-5 2.5M23.5 10.5l-5 2.5 5 2.5" stroke="#3a2200" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.500 16c-2.500 3.500-3.200 6.500-1.200 8s4 .5 3.500-2.500S10.500 17.500 9.500 16zM22.500 16c2.500 3.500 3.200 6.500 1.200 8s-4 .5-3.500-2.500S21.500 17.500 22.500 16z" fill="#8fd4ff" stroke="#2d86c9" stroke-width=".8"/><ellipse cx="8.800" cy="21" rx=".8" ry="1.500" fill="#fff" fill-opacity=".85"/><ellipse cx="23.200" cy="21" rx=".8" ry="1.500" fill="#fff" fill-opacity=".85"/><path d="M9.500 26q6.500-9 13 0z" fill="#5a1a00"/><path d="M12.500 26q3.500-4 7 0z" fill="#ff6b8a"/>'),
angry:face('<ellipse cx="11.5" cy="14" rx="1.8" ry="2.2" fill="#3a0800"/><ellipse cx="20.5" cy="14" rx="1.8" ry="2.2" fill="#3a0800"/><path d="M7.5 9l7 3M24.5 9l-7 3" stroke="#3a0800" stroke-width="2" stroke-linecap="round"/>'+S("M10 24q6-5 12 0"),"gA"),
tongue:face(E+SM+'<path d="M13 21.5v3.5a3 3 0 006 0v-3.5z" fill="#ff6b8a" stroke="#c23458" stroke-width=".8"/>'),
wow:face('<circle cx="11.5" cy="13" r="2.8" fill="#fff" stroke="#3a2200"/><circle cx="20.5" cy="13" r="2.8" fill="#fff" stroke="#3a2200"/><circle cx="11.5" cy="13.5" r="1.2" fill="#3a2200"/><circle cx="20.5" cy="13.5" r="1.2" fill="#3a2200"/><ellipse cx="16" cy="23" rx="2.6" ry="3.6" fill="#5a1a00"/>'),
love:face('<path d="M11.5 16.5c-4-2.5-4-6-1.6-6.6 1.2-.3 1.6.6 1.6.6s.4-.9 1.6-.6c2.4.6 2.4 4.1-1.6 6.6zM20.5 16.5c-4-2.5-4-6-1.6-6.6 1.2-.3 1.6.6 1.6.6s.4-.9 1.6-.6c2.4.6 2.4 4.1-1.6 6.6z" fill="#e0203a"/>'+SM),
heart:'<svg viewBox="0 0 32 32"><path d="M16 28C5 20 3 14 3 10.5 3 6.500 6 4 9.500 4c3 0 5 1.800 6.500 4C17.500 5.800 19.500 4 22.500 4 26 4 29 6.500 29 10.500 29 14 27 20 16 28z" fill="url(#gH)" stroke="#8e0f1c" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="11" cy="10" rx="5" ry="3" fill="url(#gG)" transform="rotate(-25 11 10)"/></svg>',
star:'<svg viewBox="0 0 32 32"><path d="M16 3l3.9 8.2 9 1.1-6.6 6.2 1.7 8.9L16 22.900 8 27.400l1.700-8.900L3.100 12.300l9-1.100z" fill="url(#gF)" stroke="#b86a00" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="14" cy="11" rx="5" ry="3" fill="url(#gG)" transform="rotate(-20 14 11)"/></svg>'};
const SH={":)":"smile",":(":"sad",":D":"grin",";)":"wink",":P":"tongue",":p":"tongue","<3":"heart"};
function rich(el,text){text.split(/(:[a-z]+:|:\)|:\(|:D|;\)|:[Pp]|<3)/).forEach(part=>{let n=SH[part];if(!n&&/^:[a-z]+:$/.test(part))n=part.slice(1,-1);
  if(n&&EMO[n]){const sp=document.createElement("span");sp.className="em";sp.innerHTML=EMO[n];el.appendChild(sp)}else if(part)el.appendChild(document.createTextNode(part))})}
const upd=()=>{const n=Object.values(unread).reduce((a,b)=>a+b,0);document.title=(n?"("+n+") ":"")+"Longhorn Messenger"};
let AC;const tone=(f,d,t=0,v=.08)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}};
const ding=()=>{tone(880,.15);tone(1320,.25,.1)};
const shake=()=>{const w=$("win");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake");[0,.08,.16,.24].forEach((t,i)=>tone(i%2?300:220,.07,t,.12));setTimeout(()=>w.classList.remove("shake"),600)};
const pick=(c,v)=>{const t=v.toLowerCase();for(const [re,a] of (K[c.id]||[]))if(re.test(t))return a[Math.random()*a.length|0];return c.r[Math.random()*c.r.length|0]};
const H={},unread={},T=id=>new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
let cur=null,filter="";
const $=i=>document.getElementById(i),SL={on:"В сети",aw:"Отошёл",bs:"Занят",off:"Не в сети"};
const V=(bg,x)=>`<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="${bg}"/>${x}</svg>`;
const IC={
flower:V("#bfe8ff",'<rect y="28" width="40" height="12" fill="#5cbf4a"/><g fill="#f26aa8"><circle cx="20" cy="9" r="6"/><circle cx="30" cy="16" r="6"/><circle cx="26" cy="27" r="6"/><circle cx="14" cy="27" r="6"/><circle cx="10" cy="16" r="6"/></g><circle cx="20" cy="19" r="5" fill="#ffd93b"/>'),
gear:V("#d8ecc8",'<circle cx="20" cy="20" r="15" fill="none" stroke="#3d8d24" stroke-width="5" stroke-dasharray="3 3.9"/><circle cx="20" cy="20" r="11" fill="#5fae3a"/><circle cx="20" cy="20" r="4" fill="#d8ecc8"/>'),
duck:V("#ffe7b0",'<ellipse cx="22" cy="27" rx="13" ry="9" fill="#ffcf2e"/><circle cx="16" cy="14" r="7" fill="#ffcf2e"/><path d="M9 13l-7 3 7 3z" fill="#f28a1e"/><circle cx="15" cy="12" r="1.5" fill="#222"/>'),
sun:V("#7fd0ff",'<circle cx="26" cy="14" r="7" fill="#ffe066"/><path d="M0 28Q10 22 20 28T40 28V40H0z" fill="#1c74c9"/>'),
moon:V("#3a3f7a",'<circle cx="20" cy="20" r="11" fill="#ffe9a8"/><circle cx="25" cy="16" r="10" fill="#3a3f7a"/><circle cx="8" cy="8" r="1.2" fill="#fff"/><circle cx="33" cy="30" r="1.2" fill="#fff"/>'),
me:V("#cfe8fa",'<circle cx="20" cy="15" r="7" fill="#2b86d6"/><path d="M6 40c0-10 6-15 14-15s14 5 14 15z" fill="#2b86d6"/>')};
function ava(c){return `<div class="ava ${c.st}">${IC[c.ic]}</div>`}
function renderList(){
  const f=C.filter(c=>c.n.toLowerCase().includes(filter)),on=f.filter(c=>c.st!=="off"),off=f.filter(c=>c.st==="off");
  const row=c=>`<button class="ct ${c.st==="off"?"off":""} ${cur===c.id?"sel":""}" data-id="${c.id}">${ava(c)}<div><div class="n">${c.n}</div><div class="s">${c.s}</div></div>${unread[c.id]?`<b class="bd">${unread[c.id]}</b>`:""}</button>`;
  $("list").innerHTML=(on.length?`<div class="grp">В сети (${on.length})</div>`+on.map(row).join(""):"")+(off.length?`<div class="grp">Не в сети (${off.length})</div>`+off.map(row).join(""):"");
}
function renderChat(f){
  const c=C.find(x=>x.id===cur);if(!c)return;
  $("hinfo").innerHTML=`${ava(c)}<div><b>${c.n}</b><small>${SL[c.st]}</small></div>`;
  const h=H[cur]||[],box=$("msgs");box.textContent="";box.classList.toggle("fresh",!!f);
  if(!h.length){const e=document.createElement("div");e.className="empty";e.textContent="Начни разговор с "+c.n;box.appendChild(e);return}
  let last=null;
  h.forEach(m=>{
    if(m.sys){const y=document.createElement("div");y.className="sy";y.textContent=m.t;box.appendChild(y);last=null;return}
    if(!!m.me!==last){const hd=document.createElement("div");hd.className="h";hd.textContent=(m.me?"G2961":c.n)+" говорит: ("+m.time+")";box.appendChild(hd);last=!!m.me}
    const t=document.createElement("div");t.className="t";rich(t,m.t);box.appendChild(t);
  });
  box.scrollTop=1e9;
}
function open(id){cur=id;$("chat").classList.remove("idle");unread[id]=0;upd();$("win").classList.add("open");renderList();renderChat();if(!matchMedia("(max-width:700px)").matches)$("txt").focus({preventScroll:true})}
function send(){
  const v=$("txt").value.trim();if(!v||!cur)return;
  const c=C.find(x=>x.id===cur),id=cur;
  (H[id]=H[id]||[]).push({me:1,t:v,time:T()});$("txt").value="";renderChat(1);
  if(c.st==="off"){$("typing").textContent=c.n+" не в сети — сообщение будет доставлено позже";return}
  $("typing").textContent=c.n+" печатает…";
  setTimeout(()=>{H[id].push({t:pick(c,v),time:T()});
    $("typing").textContent="";if(cur===id){renderChat(1)}else{unread[id]=(unread[id]||0)+1;upd();renderList()}
    ding()},900+Math.random()*1200);
}
$("list").onclick=e=>{const b=e.target.closest(".ct");if(b)open(+b.dataset.id)};
$("q").oninput=e=>{filter=e.target.value.toLowerCase();renderList()};
$("send").onclick=send;$("txt").onkeydown=e=>{if(e.key==="Enter")send()};
const closeChat=()=>{cur=null;setTimeout(()=>{if(cur===null)$("chat").classList.add("idle")},420);$("ep").classList.remove("open");$("typing").textContent="";$("win").classList.remove("open");renderList()};
$("back").onclick=closeChat;
$("status").onchange=e=>{$("myava").className="ava "+e.target.value};
$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};
$("myava").innerHTML=IC.me;
$("menub").onclick=e=>{e.stopPropagation();$("sm").classList.toggle("open")};
document.addEventListener("click",()=>$("sm").classList.remove("open"));
$("smTheme").onclick=()=>$("theme").click();

$("nudge").onclick=()=>{
  if(!cur)return;const c=C.find(x=>x.id===cur),id=cur;(H[id]=H[id]||[]);
  if(c.st==="off"){H[id].push({sys:1,t:c.n+" не в сети — встряхивание недоступно"});renderChat();return}
  H[id].push({sys:1,t:"Вы встряхнули: "+c.n});shake();renderChat();
  setTimeout(()=>{H[id].push({sys:1,t:"Встряхивание от "+c.n+"!"});if(cur===id){shake();renderChat()}else{unread[id]=(unread[id]||0)+1;upd();renderList()}},1200);
};
$("ep").innerHTML=Object.keys(EMO).map(n=>`<button type="button" data-c=":${n}:" aria-label="${n}"><span class="em">${EMO[n]}</span></button>`).join("");
$("emo").innerHTML=`<span class="em">${EMO.smile}</span>`;
$("emo").onclick=e=>{e.stopPropagation();$("ep").classList.toggle("open")};
$("ep").onclick=e=>{const b=e.target.closest("button");if(b){$("txt").value+=b.dataset.c+" ";$("txt").focus()}};
document.addEventListener("click",e=>{if(!e.target.closest("#ep"))$("ep").classList.remove("open")});
try{$("mood").value=localStorage.getItem("lh-mood")||""}catch(e){}
$("mood").oninput=e=>{try{localStorage.setItem("lh-mood",e.target.value)}catch(_){}};

let call=null,hideT;
const mm=n=>String(n/60|0).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const ring=k=>{if(k==="out"){tone(440,.35);tone(480,.35)}else{tone(660,.18);tone(880,.18,.22);tone(660,.18,.6);tone(880,.18,.82)}};
function showCall(c,m,text){clearTimeout(hideT);barHide();if(call)call.mini=false;const fresh=!$("call").classList.contains("open");$("call").className="call open "+(m==="talk"?"talk":"ring")+(fresh?" enter":"");$("call").dataset.m=m;$("cav").innerHTML=ava(c);$("cn").textContent=c.n;$("cs").textContent=text;$("ct").textContent=m==="talk"?"00:00":"";$("cm").textContent="Микрофон";$("cm").classList.remove("on");$("callb").disabled=!!call}
function logCall(id,text){(H[id]=H[id]||[]).push({sys:1,t:text});if(cur===id)renderChat();else{unread[id]=(unread[id]||0)+1;upd();renderList()}}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let barT=null;
const barShow=()=>{clearTimeout(barT);$("cbar").classList.remove("closing");$("cbar").classList.add("open")};
const barHide=()=>{const bar=$("cbar");if(RM||!bar.classList.contains("open")){bar.classList.remove("open","closing");return}bar.classList.add("closing");clearTimeout(barT);barT=setTimeout(()=>bar.classList.remove("open","closing"),360)};
function setMini(v){if(!call)return;call.mini=v;const w=$("call");
  if(v){w.classList.remove("open");barShow();$("cbav").innerHTML=ava(call.c);$("cbn").textContent=call.c.n;updBar()}
  else{w.classList.remove("enter");w.classList.add("open");barHide();if(!RM){w.classList.add("drop");const off=()=>w.classList.remove("drop");w.addEventListener("animationend",off,{once:true});w.addEventListener("animationcancel",off,{once:true})}}}
function updBar(){if(!call)return;$("cbt").textContent=call.st==="talk"?mm((Date.now()-call.t0)/1000|0):"Вызов…";$("cbm").classList.toggle("on",!!call.mute)}
function answer(){clearInterval(call.ri);clearTimeout(call.to);const wm=call.mini;call.st="talk";call.mute=false;call.t0=Date.now();showCall(call.c,"talk","Разговор");if(wm)setMini(true);tone(1000,.12);tone(1400,.15,.12);call.ti=setInterval(()=>{$("ct").textContent=mm((Date.now()-call.t0)/1000|0);updBar()},500)}
function endCall(reason){if(!call)return;const {id,c,st,mini}=call,secs=st==="talk"?(Date.now()-call.t0)/1000|0:0;
  clearInterval(call.ri);clearInterval(call.ti);clearTimeout(call.to);call=null;$("callb").disabled=false;
  const R={busy:["Абонент занят",c.n+" занят, звонок не принят"],none:["Нет ответа",c.n+" не ответил на звонок"],declined:["Звонок отклонён","Вы отклонили звонок от "+c.n],missed:["Пропущенный звонок","Пропущенный звонок от "+c.n],cancel:["Звонок отменён","Вы отменили звонок для "+c.n]};
  const r=st==="talk"?["Звонок завершён","Звонок с "+c.n+", "+mm(secs)]:R[reason]||R.cancel;
  if(mini){$("cbt").textContent=r[0]}else{$("cs").textContent=r[0];$("ct").textContent=st==="talk"?mm(secs):"";$("call").className="call open";$("call").dataset.m=""}
  tone(500,.15);tone(350,.25,.16);hideT=setTimeout(()=>{$("call").classList.remove("open");barHide()},1100);logCall(id,r[1])}
function startCall(id){if(call)return;const c=C.find(x=>x.id===id);
  if(c.st==="off"){logCall(id,c.n+" не в сети, звонок невозможен");return}
  call={id,c,st:"ring"};showCall(c,"out","Вызов…");ring("out");call.ri=setInterval(()=>ring("out"),2000);
  const ans=c.id===3||c.st==="on"||(c.st==="aw"&&Math.random()<.55);
  call.to=setTimeout(()=>{ans?answer():endCall(c.st==="bs"?"busy":"none")},ans?2500+Math.random()*2000:(c.st==="bs"?3000:7000))}
function incoming(id){if(call)return;const c=C.find(x=>x.id===id);
  call={id,c,st:"ring"};showCall(c,"in","Входящий звонок…");ring("in");call.ri=setInterval(()=>ring("in"),2500);call.to=setTimeout(()=>endCall("missed"),15000)}
$("callb").onclick=()=>{if(cur)startCall(cur)};
$("cacc").onclick=()=>{if(call)answer()};
$("cdec").onclick=()=>endCall("declined");
$("cend").onclick=()=>endCall(call&&call.st==="talk"?"":"cancel");
$("cm").onclick=()=>{if(!call)return;call.mute=!call.mute;$("cm").textContent=call.mute?"Включить микрофон":"Микрофон";$("call").classList.toggle("muted",call.mute);$("cm").classList.toggle("on",call.mute)};
$("cmin").onclick=()=>setMini(true);
$("cbx").onclick=()=>setMini(false);
$("cbe").onclick=()=>$("cend").click();
$("cbm").onclick=()=>{$("cm").click();updBar()};
$("smCall").onclick=()=>{const o=C.filter(c=>c.st!=="off");incoming(o[Math.random()*o.length|0].id)};
renderList();
</script>
</body>
</html>
