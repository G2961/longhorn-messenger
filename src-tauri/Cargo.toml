[package]
name = "longhorn-messenger"
version = "0.1.0"
description = "Longhorn Messenger — десктоп-обёртка (Tauri 2)"
authors = ["dev.longhorn.messenger"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "longhorn_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
ndk-context = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
wasapi = "0.24"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
